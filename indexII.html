        #slider-container {

<script>
    async function calculateSHA256(str) {
        const cleanStr = str.toLowerCase()
                            .replace(/ä/g, 'ae')
                            .replace(/ö/g, 'oe')
                            .replace(/ü/g, 'ue')
                            .replace(/ß/g, 'ss')
                            .replace(/[^a-z0-9]/g, '');

        const msgBuffer = new TextEncoder().encode(cleanStr);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function hashRawPassword(str) {
        const msgBuffer = new TextEncoder().encode(str.trim());
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function decryptWithKey(encryptedB64, keyStr) {
        try {
            const raw = atob(encryptedB64);
            const cleanKey = keyStr.toLowerCase()
                                   .replace(/ä/g, 'ae')
                                   .replace(/ö/g, 'oe')
                                   .replace(/ü/g, 'ue')
                                   .replace(/ß/g, 'ss')
                                   .replace(/[^a-z0-9]/g, '');
            let out = "";
            for (let i = 0; i < raw.length; i++) {
                out += String.fromCharCode(raw.charCodeAt(i) ^ cleanKey.charCodeAt(i % cleanKey.length));
            }
            return out;
        } catch(e) {
            return "";
        }
    }

    let currentLevelIdx = 0;
    let unlockedPasswords = {};

    function renderLevel() {
        const cur = levels[currentLevelIdx];
        document.getElementById('levelDisplay').innerText = "LEVEL: " + cur.level;
        document.getElementById('currentLevelPassword').innerText = unlockedPasswords[cur.level] || (cur.level === 0 ? "" : "(Wird nach Lösung von Level " + (cur.level - 1) + " angezeigt)");
        document.getElementById('answerInput').value = "";
        document.getElementById('levelCodeInput').value = "";

        const quizInputs = document.getElementById('quiz-inputs');
        const sliderContainer = document.getElementById('slider-container');
        const promptEl = document.getElementById('puzzlePrompt');

        if (cur.isGameLevel) {
            quizInputs.style.display = "none";
            sliderContainer.style.display = "block";
            promptEl.innerHTML = `
                <div style="font-family: Arial, sans-serif; font-size: 1.15rem; letter-spacing: 0; font-weight: normal; line-height: 1.4; margin: 15px 0;">
                    <p style="font-size: 1.3rem; font-weight: bold; margin-bottom: 5px;">Sortiere das Bild!</p>
                    <p style="font-size: 0.95rem; color: #b0c4b1;">Das Lieblingsspiel des Nerds. Löse das Puzzle, um die Cache-Koordinaten freizuschalten.</p>
                </div>
            `;
            initSlider();
        } else {
            quizInputs.style.display = "block";
            sliderContainer.style.display = "none";
            promptEl.innerText = cur.prompt;
        }
    }

    async function handleSubmit() {
        const answerInput = document.getElementById('answerInput').value.trim();
        const levelCodeInput = document.getElementById('levelCodeInput').value.trim();
        const feedback = document.getElementById('feedback');

        feedback.className = "status-msg";
        feedback.innerText = "";

        if (levelCodeInput !== "") {
            const inputPwHash = await hashRawPassword(levelCodeInput);
            const foundIdx = levels.findIndex(l => l.passwordHash === inputPwHash);
            
            if (foundIdx !== -1) {
                currentLevelIdx = foundIdx;
                unlockedPasswords[levels[currentLevelIdx].level] = levelCodeInput;
                feedback.className = "status-msg success";
                feedback.innerText = "Level geladen!";
                renderLevel();
                return;
            } else {
                feedback.className = "status-msg error";
                feedback.innerText = "Ungültiges Level-Passwort!";
                return;
            }
        }

        if (answerInput !== "" && !levels[currentLevelIdx].isGameLevel) {
            document.getElementById('lastInputDisplay').innerText = answerInput;
            const inputHash = await calculateSHA256(answerInput);

            if (inputHash === levels[currentLevelIdx].solutionHash) {
                const nextIdx = currentLevelIdx + 1;
                if (nextIdx < levels.length) {
                    unlockedPasswords[levels[nextIdx].level] = decryptWithKey(levels[nextIdx].encPass, answerInput);
                }

                currentLevelIdx++;
                feedback.className = "status-msg success";
                feedback.innerText = "Richtig! Weiter geht's...";
                renderLevel();
            } else {
                feedback.className = "status-msg error";
                feedback.innerText = "Leider falsch! Versuch es noch einmal.";
            }
        }
    }

    const nerdSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
        <rect width="300" height="300" fill="%23d838b0"/>
        <circle cx="150" cy="150" r="130" fill="%23fcd5b4"/>

        <text x="150" y="270" font-family="Impact" font-size="52" fill="%230000aa" text-anchor="middle">ALERT!</text>
    </svg>`;

    let boardState = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    let emptyPos = 8;
    let isGameSolved = false;

    function initSlider() {
        isGameSolved = false;
        document.getElementById('slider-solved').style.display = "none";
        shuffleTiles();
    }

    function renderBoard() {
        const board = document.getElementById('slider-board');
        board.innerHTML = "";

        boardState.forEach((tileIndex, pos) => {
            const div = document.createElement('div');
            div.className = "tile";

            if (tileIndex === 8) {
                div.classList.add('empty');
            } else {
                div.style.backgroundImage = `url("${nerdSvg}")`;
                const origX = (tileIndex % 3) * -100;
                const origY = Math.floor(tileIndex / 3) * -100;
                div.style.backgroundPosition = `${origX}px ${origY}px`;
            }

            div.onclick = () => moveTile(pos);
            board.appendChild(div);
        });
    }

    function moveTile(pos) {
        if (isGameSolved) return;

        const row = Math.floor(pos / 3);
        const col = pos % 3;
        const emptyRow = Math.floor(emptyPos / 3);
        const emptyCol = emptyPos % 3;

        const isAdjacent = (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;

        if (isAdjacent) {
            boardState[emptyPos] = boardState[pos];
            boardState[pos] = 8;
            emptyPos = pos;
            renderBoard();
            checkSolved();
        }
    }

    function shuffleTiles() {
        isGameSolved = false;
        document.getElementById('slider-solved').style.display = "none";
        boardState = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        emptyPos = 8;

        for (let i = 0; i < 60; i++) {
            const neighbors = getAdjacentIndices(emptyPos);
            const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
            boardState[emptyPos] = boardState[randomNeighbor];
            boardState[randomNeighbor] = 8;
            emptyPos = randomNeighbor;
        }
        renderBoard();
    }

    function getAdjacentIndices(pos) {
        const row = Math.floor(pos / 3);
        const col = pos % 3;
        const neighbors = [];
        if (row > 0) neighbors.push(pos - 3);
        if (row < 2) neighbors.push(pos + 3);
        if (col > 0) neighbors.push(pos - 1);
        if (col < 2) neighbors.push(pos + 1);
        return neighbors;
    }

    function checkSolved() {
        const solved = boardState.every((val, index) => val === index);
        if (solved) {
            isGameSolved = true;
            document.getElementById('slider-solved').style.display = "block";
            const tiles = document.querySelectorAll('.tile');
            tiles[8].classList.remove('empty');
            tiles[8].style.backgroundImage = `url("${nerdSvg}")`;
            tiles[8].style.backgroundPosition = `-200px -200px`;
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && !levels[currentLevelIdx].isGameLevel) {
            handleSubmit();
            return;
        }
        if (levels[currentLevelIdx].isGameLevel && !isGameSolved) {
            const emptyRow = Math.floor(emptyPos / 3);
            const emptyCol = emptyPos % 3;
            let targetPos = -1;

            if (event.key === "ArrowUp" && emptyRow < 2) targetPos = emptyPos + 3;
            if (event.key === "ArrowDown" && emptyRow > 0) targetPos = emptyPos - 3;
            if (event.key === "ArrowLeft" && emptyCol < 2) targetPos = emptyPos + 1;
            if (event.key === "ArrowRight" && emptyCol > 0) targetPos = emptyPos - 1;

            if (targetPos !== -1) {
                moveTile(targetPos);
            }
        }
    });

    renderLevel();
</script>
