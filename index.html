<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schlag den Nerd #1</title>
    <style>
        body {
            background-color: #041a06;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 {
            font-family: "Times New Roman", Georgia, serif;
            font-size: 2rem;
            margin-bottom: 5px;
            font-weight: normal;
        }
        .level-title {
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 1.1rem;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        /* Nerd horizontal zentriert, Sprüche rechts daneben */
        .nerd-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 15px auto 10px auto;
            min-height: 105px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .nerd-avatar {
            width: 75px;
            height: auto;
            display: block;
        }
        .nerd-speech {
            position: absolute;
            left: calc(50% + 45px);
            top: 50%;
            transform: translateY(-50%);
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            text-align: left;
            white-space: pre-line;
            max-width: 185px;
            pointer-events: none;
        }

        .puzzle-text {
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 1.7rem;
            letter-spacing: 5px;
            font-weight: bold;
            margin: 20px auto;
            text-align: center;
            white-space: nowrap;
        }
        .form-container {
            max-width: 480px;
            margin: 0 auto;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            background-color: #2b332c;
            border: 1px solid #555555;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #79a77d;
        }
        .info-text {
            font-size: 0.85rem;
            color: #b0c4b1;
            margin-top: 6px;
            margin-bottom: 20px;
            min-height: 1.2em;
        }
        .level-password-display {
            font-size: 0.9rem;
            margin-top: 6px;
            margin-bottom: 20px;
            color: #ffffff;
        }
        button {
            background-color: #8c8c8c;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 6px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        button:hover {
            background-color: #a8a8a8;
        }
        .status-msg {
            margin-top: 15px;
            font-weight: bold;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }

        /* Schiebepuzzle */
        #slider-container {
            display: none;
            margin: 10px auto 25px auto;
            max-width: 360px;
            text-align: center;
        }
        #slider-board {
            width: 300px;
            height: 300px;
            margin: 15px auto;
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            background-color: #000000;
            border: 3px solid #79a77d;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            touch-action: manipulation;
        }
        .tile {
            width: 100px;
            height: 100px;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.45);
            background-color: #f7b733;
            background-repeat: no-repeat;
            background-size: 300px 300px, 100% 100%;
            transition: transform 0.08s ease;
        }
        .tile.empty {
            background: #000000 !important;
            border: none;
            cursor: default;
        }
        .final-box {
            background: #0d3810;
            border: 2px solid #51cf66;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>Schlag den Nerd #1</h1>
    <div id="levelDisplay" class="level-title">LEVEL: 0</div>

    <div class="nerd-container">
        <img id="nerdDisplay" class="nerd-avatar" src="https://s1.directupload.eu/images/user/261023/n8qv4d3g.png" alt="Nerd">
        <div id="nerdSpeech" class="nerd-speech"></div>
    </div>

    <div id="puzzlePrompt" class="puzzle-text">0 G C i d T b d W g</div>

    <div id="quiz-inputs">
        <label for="answerInput">Lösungsvorschlag:</label>
        <input type="text" id="answerInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        
        <div class="info-text">
            Letzte Eingabe: <span id="lastInputDisplay">keine</span>
        </div>

        <label for="levelCodeInput">Passwort für anderes Level eingeben:</label>
        <input type="text" id="levelCodeInput" autocomplete="off">

        <div class="level-password-display">
            Passwort für dieses Level: <span id="currentLevelPassword"></span>
        </div>

        <button type="button" onclick="handleSubmit()">Eingaben absenden!</button>
    </div>

    <div id="slider-container">
        <p style="font-size: 0.95rem; line-height: 1.4; margin: 0 auto 10px auto; max-width: 320px;">
            Tippe auf ein Teil neben dem schwarzen Feld, um es zu verschieben:
        </p>
        <div id="slider-board"></div>
        <button type="button" onclick="resetSlider()" style="margin-top: 10px;">Zurücksetzen</button>
        <div id="slider-solved" class="final-box" style="display: none;">
            <h3 style="margin-top: 0; color: #51cf66;">Geschafft! Das Puzzle ist gelöst!</h3>
            <p>Hier sind deine Final-Koordinaten für den Cache:</p>
            <p id="finalCoordinatesDisplay" style="font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; color: #ffd700;">
                N 48° 52.XXX  E 011° 12.YYY
            </p>
        </div>
    </div>

    <div id="feedback" class="status-msg"></div>
</div>

<script>
    const nerdImages = {
        default: "https://s1.directupload.eu/images/user/261023/n8qv4d3g.png",
        img1:    "https://s1.directupload.eu/images/user/261023/tneu278a.png",
        img2:    "https://s1.directupload.eu/images/user/261023/8q89yada.png",
        img3:    "https://s1.directupload.eu/images/user/261023/u54wgfdv.png",
        img4:    "https://s1.directupload.eu/images/user/261023/kaaynk5c.png"
    };

    function setNerdImage(imgKey) {
        document.getElementById('nerdDisplay').src = nerdImages[imgKey] || nerdImages.default;
    }

    const nerdJokes = [
        { text: "'Nein.'", img: "img1" },
        { text: "'Neinlein!'", img: "img1" },
        { text: "'Is doch easy..'", img: "img2" },
        { text: "'Is doch easy..\nFür mich!'", img: "img3" },
        { text: "'LANGWEILIG!'", img: "img1" },
        { text: "'UUUAAAHHAA!!'", img: "img4" },
        { type: "joke", q: "'Genitiv ins Wasser'", a: "'Da tiv.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Wer abnimmt..'", a: "'hat mehr vom Telefon.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Was ist durchsichtig und riecht nach Karotten?'", a: "'Ein Kaninchenfurz.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Werden Sie Jäger: Lernen Sie schiessen...'", a: "'und treffen Sie neue Freunde.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Was macht ein Clown im Büro?'", a: "'Faxen.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Was ist braun und sitzt hinter Gittern?'", a: "'Eine Knastanie.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Kommt ein Skellet zum Arzt. Sagt der Arzt:'", a: "'Sie kommen aber reichlich spät.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Was ist weis und stört beim Essen?'", a: "'Eine Lawine.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Was hat vier Beine und kann fliegen?'", a: "'Zwei Vögel.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Was ist grün und fliegt?'", a: "'Ein ferngesteuertes Essiggürckchen.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Was ist das Gegenteil von Magnet?'", a: "'Mag-schon.'", imgQ: "img1", imgA: "img2" },
        { type: "joke", q: "'Wie lautet der Vorname vom Reh?'", a: "'Kartoffelpü.'", imgQ: "img1", imgA: "img2" }
    ];

    let pendingJokePunchline = null;
    let pendingJokeImg = "img2";
    let jokeCounter = 0;

    function triggerNerdReaction() {
        const speechEl = document.getElementById('nerdSpeech');
        let quote = "";
        let imgKey = "img1";

        if (pendingJokePunchline) {
            quote = pendingJokePunchline;
            imgKey = pendingJokeImg;
            pendingJokePunchline = null;
        } else {
            const currentItem = nerdJokes[jokeCounter % nerdJokes.length];
            jokeCounter++;

            if (currentItem.type === "joke") {
                quote = currentItem.q;
                imgKey = currentItem.imgQ;
                pendingJokePunchline = currentItem.a;
                pendingJokeImg = currentItem.imgA;
            } else {
                quote = currentItem.text;
                imgKey = currentItem.img;
            }
        }

        speechEl.innerText = quote;
        setNerdImage(imgKey);
    }

    function cleanString(str) {
        return str.toLowerCase()
                  .replace(/ä/g, 'ae')
                  .replace(/ö/g, 'oe')
                  .replace(/ü/g, 'ue')
                  .replace(/ß/g, 'ss')
                  .replace(/[^a-z0-9]/g, '');
    }

    // Original-Levelkonfiguration von hattadone.de
    const levels = [
        {
            level: 0,
            prompt: "0 G C i d T b d W g",
            solutions: ["0gradcelsiusistdietemperaturbeiderwassergefriert"],
            password: ""
        },
        {
            level: 1,
            prompt: "1 S m n k S",
            solutions: [
                "1schwalbemachtnochkeinensommer",
                "1schwalbemachtnocheinensommer",
                "1schwalbemachtkeinensommer"
            ],
            password: "5nJMdhWX"
        },
        {
            level: 2,
            prompt: "2 i d k P Z",
            solutions: ["2istdiekleinsteprimzahl"],
            password: "s7sbq0Xx"
        },
        {
            level: 3,
            prompt: "3 C m d K B",
            solutions: ["3chinesenmitdemkontrabass"],
            password: "O1u9eYbd"
        },
        {
            level: 4,
            prompt: "D 4 E F L W E",
            solutions: [
                "die4elementefeuerluftwassererde",
                "die4elementefeuerwasserlufterde"
            ],
            password: "UKVk85SJ"
        },
        {
            level: 5,
            prompt: "5 F a e H",
            solutions: ["5fingeraneinerhand"],
            password: "lfRDs9EU"
        },
        {
            level: 6,
            prompt: "6 S h d W",
            solutions: [
                "6seitenhatderwuerfel",
                "6seitenhateinwuerfel"
            ],
            password: "9195Pgpa"
        },
        {
            level: 7,
            prompt: "SW u d 7 Z",
            solutions: ["schneewittchenunddie7zwerge"],
            password: "jF5cHDp3"
        },
        {
            level: 8,
            prompt: "U SS h 8 P",
            solutions: ["unsersonnensystemhat8planeten"],
            password: "10IpsWRw"
        },
        {
            level: 9,
            prompt: "E SS d b M 9 M",
            solutions: [
                "eineschwangerschaftdauertbeimmenschen9monate",
                "eineschwangerschaftbeimmenschendauert9monate"
            ],
            password: "LvyME8p9ZT"
        },
        {
            level: 10,
            prompt: "M u d 10 G",
            solutions: ["mosesunddie10gebote"],
            password: "pNmkx7PzOS"
        },
        {
            level: 11,
            prompt: "E FBM b a 11 S",
            solutions: [
                "einefussballmannschaftbestehtaus11spielern",
                "einefussballmannschaftbestehtaus11spieler",
                "einefussballmannschaftbestehtauselfspielern",
                "einefussballmannschaftbestehtauselfspieler"
            ],
            password: "Rf1YYHJM15"
        },
        {
            level: 12,
            prompt: "12 M h d J",
            solutions: ["12monatehatdasjahr"],
            password: "EhEVLRl0FV"
        },
        {
            level: 13,
            prompt: "13 i k GZ",
            solutions: ["13istkeineglueckszahl"],
            password: "ZLPR407S6Q"
        },
        {
            level: 14,
            prompt: "",
            solutions: [],
            password: "10EThb5Ea7u",
            isGameLevel: true
        }
    ];

    let currentLevelIdx = 0;

    function renderLevel() {
        const cur = levels[currentLevelIdx];
        document.getElementById('levelDisplay').innerText = "LEVEL: " + cur.level;
        document.getElementById('currentLevelPassword').innerText = cur.password || "";
        document.getElementById('answerInput').value = "";
        document.getElementById('levelCodeInput').value = "";
        document.getElementById('nerdSpeech').innerText = "";
        document.getElementById('feedback').innerText = "";
        pendingJokePunchline = null;

        setNerdImage('default');

        const quizInputs = document.getElementById('quiz-inputs');
        const sliderContainer = document.getElementById('slider-container');
        const promptEl = document.getElementById('puzzlePrompt');

        if (cur.isGameLevel) {
            quizInputs.style.display = "none";
            sliderContainer.style.display = "block";
            promptEl.style.whiteSpace = "normal";
            promptEl.style.letterSpacing = "0";
            promptEl.innerHTML = `
                <div style="max-width: 440px; margin: 0 auto; text-align: center; font-size: 0.95rem; line-height: 1.45;">
                    <div style="font-size: 1.4rem; font-weight: bold; margin-bottom: 8px; color: #ffffff;">Du hast dich sehr gut geschlagen!</div>
                    <div style="margin-bottom: 10px; color: #b0c4b1;">
                        Doch jetzt holt der Nerd noch eine Gemeinheit für dich bereit: <strong>sein Lieblingsspiel</strong>.<br>
                        Das musst du erfolgreich lösen, um an die Cache-Koordinaten zu kommen.
                    </div>
                </div>
            `;
            initSlider();
        } else {
            quizInputs.style.display = "block";
            sliderContainer.style.display = "none";
            promptEl.style.whiteSpace = "nowrap";
            promptEl.style.letterSpacing = "5px";
            promptEl.innerText = cur.prompt;
        }
    }

    function handleSubmit() {
        const answerInput = document.getElementById('answerInput').value.trim();
        const levelCodeInput = document.getElementById('levelCodeInput').value.trim();
        const feedback = document.getElementById('feedback');

        feedback.className = "status-msg";
        feedback.innerText = "";

        // 1. Level-Passwort prüfen
        if (levelCodeInput !== "") {
            const foundIdx = levels.findIndex(l => l.password.toLowerCase() === levelCodeInput.toLowerCase());
            if (foundIdx !== -1) {
                currentLevelIdx = foundIdx;
                feedback.className = "status-msg success";
                feedback.innerText = "Level geladen!";
                renderLevel();
                return;
            } else {
                feedback.className = "status-msg error";
                feedback.innerText = "Ungültiges Level-Passwort!";
                return;
            }
        }

        // 2. Antwort prüfen
        if (answerInput !== "" && !levels[currentLevelIdx].isGameLevel) {
            document.getElementById('lastInputDisplay').innerText = answerInput;
            const cleaned = cleanString(answerInput);
            const cur = levels[currentLevelIdx];

            if (cur.solutions.includes(cleaned)) {
                currentLevelIdx++;
                feedback.className = "status-msg success";
                feedback.innerText = "Richtig! Weiter geht's...";
                renderLevel();
            } else {
                triggerNerdReaction();
                document.getElementById('answerInput').value = "";
            }
        }
    }

    /* Schiebepuzzle: nerd2 + Oranger Farbverlauf (Garantiert lösbare Belegung) */
    const puzzleImg = "https://s1.directupload.eu/images/user/261023/8q89yada.png";

    const initialBoard = [4, 7, 1, 3, 0, 2, 6, 5, 8];
    const initialEmpty = 8;

    let boardState = [...initialBoard];
    let emptyPos = initialEmpty;
    let isGameSolved = false;

    function initSlider() {
        isGameSolved = false;
        document.getElementById('slider-solved').style.display = "none";
        resetSlider();
    }

    function resetSlider() {
        if (isGameSolved) return;
        boardState = [...initialBoard];
        emptyPos = initialEmpty;
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('slider-board');
        board.innerHTML = "";

        boardState.forEach((tileIndex, pos) => {
            const div = document.createElement('div');
            div.className = "tile";

            if (tileIndex === 8) {
                div.classList.add('empty');
            } else {
                div.style.backgroundImage = `url("${puzzleImg}"), linear-gradient(135deg, #fc4a1a, #f7b733)`;
                const origX = (tileIndex % 3) * -100;
                const origY = Math.floor(tileIndex / 3) * -100;
                div.style.backgroundPosition = `${origX}px ${origY}px, center`;
            }

            div.onclick = () => moveTile(pos);
            board.appendChild(div);
        });
    }

    function moveTile(pos) {
        if (isGameSolved) return;

        const row = Math.floor(pos / 3);
        const col = pos % 3;
        const emptyRow = Math.floor(emptyPos / 3);
        const emptyCol = emptyPos % 3;

        const isAdjacent = (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;

        if (isAdjacent) {
            boardState[emptyPos] = boardState[pos];
            boardState[pos] = 8;
            emptyPos = pos;
            renderBoard();
            checkSolved();
        }
    }

    function checkSolved() {
        const solved = boardState.every((val, index) => val === index);
        if (solved) {
            isGameSolved = true;
            document.getElementById('slider-solved').style.display = "block";
            const tiles = document.querySelectorAll('.tile');
            if (tiles[8]) {
                tiles[8].classList.remove('empty');
                tiles[8].style.backgroundImage = `url("${puzzleImg}"), linear-gradient(135deg, #fc4a1a, #f7b733)`;
                tiles[8].style.backgroundPosition = "-200px -200px, center";
            }
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && !levels[currentLevelIdx].isGameLevel) {
            handleSubmit();
            return;
        }
        if (levels[currentLevelIdx].isGameLevel && !isGameSolved) {
            const emptyRow = Math.floor(emptyPos / 3);
            const emptyCol = emptyPos % 3;
            let targetPos = -1;

            if (event.key === "ArrowUp" && emptyRow < 2) targetPos = emptyPos + 3;
            if (event.key === "ArrowDown" && emptyRow > 0) targetPos = emptyPos - 3;
            if (event.key === "ArrowLeft" && emptyCol < 2) targetPos = emptyPos + 1;
            if (event.key === "ArrowRight" && emptyCol > 0) targetPos = emptyPos - 1;

            if (targetPos !== -1) {
                moveTile(targetPos);
            }
        }
    });

    renderLevel();
</script>

</body>
</html>
