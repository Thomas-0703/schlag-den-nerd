<script>
    /* Synchrones SHA-256 zur Verifizierung von Lösungen und Passwörtern */
    function sha256(ascii) {
        function rightRotate(value, amount) {
            return (value >>> amount) | (value << (32 - amount));
        }
        const mathPow = Math.pow;
        const maxWord = mathPow(2, 32);
        let i, j;
        let result = '';
        const words = [];
        const asciiBitLength = ascii.length * 8;
        
        const K = [
            0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
            0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
            0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
            0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
            0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
            0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
            0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
            0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];
        let H = [
            0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
            0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
        ];

        ascii += '\x80';
        while (ascii.length % 64 - 56) ascii += '\x00';
        for (i = 0; i < ascii.length; i++) {
            j = ascii.charCodeAt(i);
            words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words.length] = ((asciiBitLength / maxWord) | 0);
        words[words.length] = (asciiBitLength) | 0;

        for (j = 0; j < words.length;) {
            const w = words.slice(j, j += 16);
            const oldHash = H;
            H = H.slice(0, 8);
            for (i = 0; i < 64; i++) {
                const w15 = w[i - 15], w2 = w[i - 2];
                const a = H[0], e = H[4];
                const temp1 = H[7]
                    + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                    + ((e & H[5]) ^ ((~e) & H[6]))
                    + K[i]
                    + (w[i] = (i < 16) ? w[i] : (
                            w[i - 16]
                            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                            + w[i - 7]
                            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                        ) | 0
                    );
                const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                    + ((a & H[1]) ^ (a & H[2]) ^ (H[1] & H[2]));
                H = [(temp1 + temp2) | 0].concat(H);
                H[4] = (H[4] + temp1) | 0;
            }
            for (i = 0; i < 8; i++) {
                H[i] = (H[i] + oldHash[i]) | 0;
            }
        }
        for (i = 0; i < 8; i++) {
            for (j = 3; j + 1; j--) {
                const b = (H[i] >> (j * 8)) & 255;
                result += ((b < 16) ? '0' : '') + b.toString(16);
            }
        }
        return result;
    }

    /* Entschlüsselt das nächste Passwort dynamisch mit der eingegebenen Lösung */
    function decryptPassword(b64Cipher, keyStr) {
        if (!b64Cipher || !keyStr) return "";
        try {
            const raw = atob(b64Cipher);
            let out = "";
            for (let i = 0; i < raw.length; i++) {
                out += String.fromCharCode(raw.charCodeAt(i) ^ keyStr.charCodeAt(i % keyStr.length));
            }
            return out;
        } catch (e) {
            return "";

    function renderLevel() {

        document.getElementById('levelDisplay').innerText = "LEVEL: " + cur.level;

        const sliderContainer = document.getElementById('slider-container');
        const promptEl = document.getElementById('puzzlePrompt');

        if (cur.isGameLevel) {
            quizInputs.style.display = "none";

    function handleSubmit() {
        const answerInput = document.getElementById('answerInput').value.trim();
        const levelCodeInput = document.getElementById('levelCodeInput').value.trim();
        const feedback = document.getElementById('feedback');

        feedback.className = "status-msg";
        feedback.innerText = "";

        // 1. Level-Sprung: Prüfung rein über SHA-256 (Passwörter stehen nirgends im Klartext)
        if (levelCodeInput !== "") {
            const inputPwHash = sha256(levelCodeInput.toLowerCase());
            const foundIdx = levels.findIndex(l => l.pwHash && l.pwHash === inputPwHash);
            
            if (foundIdx !== -1) {
                currentLevelIdx = foundIdx;
                currentPasswordPlain = levelCodeInput;
                feedback.className = "status-msg success";
                feedback.innerText = "Level geladen!";
                renderLevel();
                return;

                feedback.className = "status-msg error";
                feedback.innerText = "Ungültiges Level-Passwort!";
                return;
            }
        }

        // 2. Antwort prüfen (Lösung wird gehasht verglichen; entschlüsselt nächstes Passwort)
        if (answerInput !== "" && !levels[currentLevelIdx].isGameLevel) {
            document.getElementById('lastInputDisplay').innerText = answerInput;
            const cleaned = cleanString(answerInput);
            const inputHash = sha256(cleaned);
            const cur = levels[currentLevelIdx];

            if (cur.solutionHashes.includes(inputHash)) {
                const nextIdx = currentLevelIdx + 1;
                if (nextIdx < levels.length) {
                    currentPasswordPlain = decryptPassword(levels[nextIdx].encPw, cleaned);
                }
                currentLevelIdx = nextIdx;
                feedback.className = "status-msg success";
                feedback.innerText = "Richtig! Weiter geht's...";
                renderLevel();
            } else {
                triggerNerdReaction();
                document.getElementById('answerInput').value = "";
            }
        }
    }

    /* Schiebepuzzle: nerd2 + Oranger Farbverlauf (Garantiert lösbare Belegung) */
    const puzzleImg = "https://s1.directupload.eu/images/user/261023/8q89yada.png";

    const initialBoard = [4, 7, 1, 3, 0, 2, 6, 5, 8];
    const initialEmpty = 8;

    let boardState = [...initialBoard];
    let emptyPos = initialEmpty;
    let isGameSolved = false;

    function initSlider() {
        isGameSolved = false;
        document.getElementById('slider-solved').style.display = "none";
        resetSlider();
    }

    function resetSlider() {
        if (isGameSolved) return;
        boardState = [...initialBoard];
        emptyPos = initialEmpty;
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('slider-board');
        board.innerHTML = "";

        boardState.forEach((tileIndex, pos) => {
            const div = document.createElement('div');
            div.className = "tile";

            if (tileIndex === 8) {
                div.classList.add('empty');
            } else {
                div.style.backgroundImage = `url("${puzzleImg}"), linear-gradient(135deg, #fc4a1a, #f7b733)`;
                const origX = (tileIndex % 3) * -100;
                const origY = Math.floor(tileIndex / 3) * -100;
                div.style.backgroundPosition = `${origX}px ${origY}px, center`;
            }

            div.onclick = () => moveTile(pos);
            board.appendChild(div);
        });
    }

    function moveTile(pos) {
        if (isGameSolved) return;

        const row = Math.floor(pos / 3);
        const col = pos % 3;
        const emptyRow = Math.floor(emptyPos / 3);
        const emptyCol = emptyPos % 3;

        const isAdjacent = (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;

        if (isAdjacent) {
            boardState[emptyPos] = boardState[pos];
            boardState[pos] = 8;
            emptyPos = pos;
            renderBoard();
            checkSolved();
        }
    }

    function checkSolved() {
        const solved = boardState.every((val, index) => val === index);
        if (solved) {
            isGameSolved = true;
            document.getElementById('slider-solved').style.display = "block";
            const tiles = document.querySelectorAll('.tile');
            if (tiles[8]) {
                tiles[8].classList.remove('empty');
                tiles[8].style.backgroundImage = `url("${puzzleImg}"), linear-gradient(135deg, #fc4a1a, #f7b733)`;
                tiles[8].style.backgroundPosition = "-200px -200px, center";
            }
            
            // Koordinaten werden erst mit dem gelösten Puzzle-Zustand per XOR entschlüsselt
            const key = boardState.join('') + "_solved";
            const cipher = atob("fhEGC4QVAwUWbEZeS1ZFIRABAwKEFQcFFmpKWks=");
            let coords = "";
            for (let i = 0; i < cipher.length; i++) {
                coords += String.fromCharCode(cipher.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            document.getElementById('finalCoordinatesDisplay').innerText = coords;
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && !levels[currentLevelIdx].isGameLevel) {
            handleSubmit();
            return;
        }
        if (levels[currentLevelIdx].isGameLevel && !isGameSolved) {
            const emptyRow = Math.floor(emptyPos / 3);
            const emptyCol = emptyPos % 3;
            let targetPos = -1;

            if (event.key === "ArrowUp" && emptyRow < 2) targetPos = emptyPos + 3;
            if (event.key === "ArrowDown" && emptyRow > 0) targetPos = emptyPos - 3;
            if (event.key === "ArrowLeft" && emptyCol < 2) targetPos = emptyPos + 1;
            if (event.key === "ArrowRight" && emptyCol > 0) targetPos = emptyPos - 1;

            if (targetPos !== -1) {
                moveTile(targetPos);
            }
        }
    });

    renderLevel();
</script>

</body>
